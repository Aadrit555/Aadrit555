<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="230" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D131F" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00BBF9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BBF9" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0F7FA" />
      <stop offset="70%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="waveGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="230" fill="url(#bgGrad)" rx="8" />

  <g opacity="0.15" fill="#00F5D4">
    <circle cx="120" cy="50" r="2" />
    <circle cx="240" cy="80" r="1.5" />
    <circle cx="360" cy="40" r="2" />
    <circle cx="840" cy="45" r="2" />
    <circle cx="960" cy="75" r="1.5" />
    <circle cx="1080" cy="40" r="2" />
  </g>

  <path d="M 0,165 C 200,125 400,205 600,160 C 800,115 1000,195 1200,155 L 1200,230 L 0,230 Z" fill="url(#wave1)" />
  <path d="M 0,180 C 180,140 380,215 620,175 C 840,135 1020,200 1200,170 L 1200,230 L 0,230 Z" fill="url(#wave2)" />
  <path d="M 0,195 C 220,160 420,225 650,190 C 870,155 1050,210 1200,185 L 1200,230 L 0,230 Z" fill="url(#wave3)" opacity="0.9" filter="url(#waveGlow)" />

  <text x="600" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="2.5" fill="url(#textGrad)" filter="url(#glow)">Aadrit</text>

  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="500" letter-spacing="1.2" fill="#94A3B8">Building things in C++ &amp; Python  •  Low-level systems &amp; ML</text>
</svg>